services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 5433 on the host, so this never collides with a native
      # PostgreSQL already listening on 5432.
      - "5433:5432"
    volumes:
      # A NAMED volume, deliberately not a bind mount: bind-mounting the data
      # directory to a Windows path is a permissions and fsync-performance
      # disaster.
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Without this (and the service_healthy condition below), the first
      # `alembic upgrade` races container startup and fails -- reliably so on
      # Windows, where containers start more slowly.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  api:
    build: .
    # Not started by `docker compose up -d db`; run the API locally with
    # `uv run poe dev` during development, or `docker compose up api` to
    # exercise the image.
    profiles: ["api"]
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
