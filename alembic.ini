[alembic]
script_location = alembic

# Keep POSIX separators here; this is resolved relative to %(here)s on every OS.
prepend_sys_path = src

# REQUIRED on Windows. Without this key, Alembic falls back to legacy parsing
# that splits prepend_sys_path on COLONS -- which shreds "C:\path" into "C" and
# "\path" and surfaces much later as a baffling ModuleNotFoundError.
path_separator = os

# Timestamped, slugged filenames sort chronologically and read well in review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# NOTE: Alembic's `timezone` option is deliberately NOT set.
#
# Setting it (e.g. `timezone = UTC`) makes `alembic revision` fail with
# "Can't locate timezone: UTC" unless python-dateutil is installed -- Alembic
# does not depend on it. Revision filenames therefore use local time. If you
# want UTC ordering across a distributed team, add `python-dateutil` to your
# dependencies and then set `timezone = UTC` here.

# NOTE: there is deliberately no `sqlalchemy.url` here.
#
# The URL comes from pydantic-settings via alembic/env.py, so credentials never
# live in a committed file and there is one source of truth. It also sidesteps a
# real bug: set_main_option() writes through ConfigParser, which treats `%` as
# interpolation syntax, so any percent-encoded password (`@` -> `%40`) raises
# InterpolationSyntaxError.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
